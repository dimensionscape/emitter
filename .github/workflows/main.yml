name: CI

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib install utest --quiet
          haxelib install hxnodejs --quiet
          haxelib install hxcpp --quiet

      - name: Run the example
        working-directory: example
        run: haxe build.hxml

      # HashLink is not on the runners: its tests run where it is installed.
      - name: Run the tests on eval, Node, the jvm, natively and on Neko
        run: haxe test/all.hxml eval node jvm cpp neko

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Generate the documentation
        run: |
          haxelib install dox --quiet
          cd script
          haxe docs.hxml
          haxelib run dox -i xml -o ../docs --exclude "emitter._internal"

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: emitter-docs
          path: docs
